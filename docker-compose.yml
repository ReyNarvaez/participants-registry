name: curebase

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: curebase
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres -d curebase
      interval: 2s
      retries: 15

volumes:
  db:
